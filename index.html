<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Saludar</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
      }

      #saludar-form {
        display: flex;
        flex-direction: column;
        width: min(100%, 320px);
        gap: 12px;
        margin: 0 auto;
        padding: 16px;
        border: 1px solid ;
        border-radius: 8px;
      }

      #saludar-form input,
      #saludar-form select {
        width: 100%;
        padding: 10px 12px;
        font-size: 1rem;
        border: 1px solid;
        border-radius: 6px;
      }

      

      @media (max-width: 600px) {
        body {
          padding: 12px;
        }

        #saludar-form {
          width: 100%;
          max-width: 100%;
          padding: 12px;
        }

        #saludar-form input,
        #saludar-form select {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <h1>Saludar</h1>
    <form id="saludar-form">
      <input type="text" name="Ingresa tu nombre" id="saludar-nombre" placeholder="Ingresa tu nombre" />
      <p>Selecciona tu género</p>
      <select name="genero" id="saludar-genero">

        <option value="masculino">Masculino</option>
        <option value="femenino">Femenino</option>
      </select>
      <input type="number" name="Edad" id="saludar-edad" placeholder="Ingresa tu edad" />
      <p>Selecciona el idioma</p>
      <select name="idioma" id="saludar-idioma">
        <option value="es">Español</option>
        <option value="en">Inglés</option>

      </select>
      <input type="submit" value="Saludar" id="saludar-button"  />
    </form>
    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
