<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Saludar</title>
    <style>
      *{
        box-sizing: border-box;
      }
      #saludar-form{
        display: flex;
        flex-direction: column;
        width: 300px;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Saludar</h1>
    <form id="saludar-form">
      <input type="text" name="Ingresa tu nombre" id="saludar-nombre" placeholder="Ingresa tu nombre" />
      <p>Selecciona tu género</p>
      <select name="genero" id="saludar-genero">

        <option value="masculino">Masculino</option>
        <option value="femenino">Femenino</option>
      </select>
      <input type="number" name="Edad" id="saludar-edad" placeholder="Ingresa tu edad" />
      <p>Selecciona el idioma</p>
      <select name="idioma" id="saludar-idioma">
        <option value="es">Español</option>
        <option value="en">Inglés</option>

      </select>
      <input type="submit" value="Saludar" id="saludar-button"  />
    </form>
    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
